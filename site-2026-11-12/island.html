<title>Island Games — The Pirates of Ybor</title><link rel="stylesheet" href="assets/site.css">
<style>
/* One game made for each island. © 2026 Adam Kornreich / R.A. Consulting ❤ Pops & Pippy */
#stage{max-width:560px;margin:0 auto;text-align:center}
#cv{width:100%;max-width:520px;aspect-ratio:4/3;background:linear-gradient(180deg,#123a52,#0b1a26);border:2px solid var(--gold);border-radius:12px;touch-action:none;display:none}

.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:340px;margin:0 auto}
.pads button{aspect-ratio:1;border-radius:18px;border:3px solid #0006;font-size:2rem;cursor:pointer;opacity:.6}
.pads button.lit{opacity:1;transform:scale(1.04);box-shadow:0 0 26px #fff8}
.big{font-size:clamp(1.6rem,7vw,2.6rem);letter-spacing:.22em;color:var(--gold2);margin:14px 0;font-weight:bold}
.letters{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}
.letters button{min-width:46px;min-height:46px;font-size:1.3rem;font-weight:bold;border-radius:10px;border:2px solid var(--gold);background:#0e1524;color:#f4e6c6;cursor:pointer}
.letters button:disabled{opacity:.25}

#draw.go{background:#1f8a4c}
#msg{min-height:1.6em;color:var(--fog);margin:10px 0}
.also{margin-top:16px}
</style></head>

    <div id="dom"></div>
